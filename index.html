<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The New Deal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #e8ddc4;
  --bg2: #ddd2b8;
  --bg3: #d2c6aa;
  --gold: #6b2a14;
  --gold-dim: #4a3020;
  --cream: #f2ead2;
  --card-bg: #f2ead2;
  --crisis-bg: #e8d4ba;
  --crisis-border: #7a1a0a;
  --crisis-text: #7a1a0a;
  --text: #2a1a0e;
  --text-dim: #6a5a44;
  --text-dark: #1a0e05;
  --green: #2a5a1e;
  --red: #8b1a1a;
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --cat-IC: #2a4470; --cat-AR: #3a5a2a; --cat-FN: #6a5a14;
  --cat-BK: #4a2a6a; --cat-NS: #7a2a1a; --cat-IF: #7a4a14;
  --cat-PW: #1a4a5a; --cat-WF: #6a2a4a;
  --max-w: 1400px;
  --rule: #b8a47a;
  --rule-dark: #7a6a4a;
}

html { font-size: 18px; }
body {
  font-family: var(--sans); background-color: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  background-image: radial-gradient(ellipse at 50% 0%, rgba(250,245,225,0.4) 0%, transparent 55%);
  position: relative;
}
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background:
    radial-gradient(ellipse at 0% 0%, rgba(80,60,30,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 100% 100%, rgba(80,60,30,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(80,60,30,0.04) 100%);
}

/* ===== HEADER ===== */
header {
  width: 100%; max-width: var(--max-w); padding: 1rem 2rem 0.5rem;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem;
}
h1 {
  font-family: var(--serif); font-weight: 900; font-size: 2rem;
  color: var(--text-dark); letter-spacing: 0.15em; text-transform: uppercase;
}
.hud { display: flex; gap: 1.5rem; align-items: center; }
.hud-item { display: flex; flex-direction: column; align-items: center; }
.hud-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); }
.hud-value { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; color: var(--text-dark); }
.hud-phase {
  font-size: 0.85rem; padding: 0.25rem 1rem;
  border: 2px solid var(--rule-dark); background: transparent;
  color: var(--text-dark); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
}

/* ===== TIMELINE ===== */
.timeline { display: flex; gap: 0; align-items: center; }
.timeline-year {
  font-family: var(--serif); font-size: 0.7rem; padding: 0.2rem 0.45rem;
  color: var(--text-dim); border-bottom: 2px solid transparent;
  transition: all 0.3s; letter-spacing: 0.02em;
}
.timeline-year.active {
  color: var(--text-dark); font-weight: 700; font-size: 0.85rem;
  border-bottom-color: var(--gold);
}

/* ===== DECO ===== */
.deco { width: 100%; max-width: var(--max-w); height: 0; border-top: 3px double var(--rule-dark); margin: 0.3rem 0; }

/* ===== SCOREBOARD ===== */
.scoreboard {
  width: 100%; max-width: var(--max-w); padding: 0.6rem 2rem;
  display: grid; grid-template-columns: repeat(8, 1fr) auto; gap: 0;
  border-bottom: 1px solid var(--rule);
}
.score-cell {
  text-align: center; padding: 0.5rem 0.3rem;
  background: transparent; border-left: 1px solid var(--rule); position: relative; transition: all 0.3s;
}
.score-cell:first-child { border-left: none; }
.score-total {
  text-align: center; padding: 0.5rem 0.6rem;
  border-left: 2px solid var(--rule-dark); position: relative; cursor: help;
}
.score-total .total-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: var(--text-dim); }
.score-total .total-value { font-family: var(--serif); font-size: 1.8rem; font-weight: 900; color: var(--text-dark); }
.score-total .total-tooltip {
  display: none; position: absolute; bottom: calc(100% + 0.5rem); right: 0;
  background: var(--text-dark); color: var(--cream); font-size: 0.75rem; line-height: 1.5;
  padding: 0.5rem 0.8rem; border-radius: 3px; white-space: nowrap; z-index: 10;
  box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
}
.score-total .total-tooltip::after {
  content: ''; position: absolute; top: 100%; right: 1rem;
  border: 6px solid transparent; border-top-color: var(--text-dark);
}
.score-total:hover .total-tooltip { display: block; }
.score-cell .cat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.score-cell .cat-name { font-size: 0.65rem; color: var(--text-dim); }
.score-cell .cat-score { font-family: var(--serif); font-size: 1.8rem; font-weight: 700; color: var(--text-dark); }
.score-cell.flash-up { background: rgba(42,90,30,0.08); }
.score-cell.flash-down { background: rgba(139,26,26,0.08); }
.score-pop {
  position: absolute; top: -0.6rem; right: 0.4rem; font-size: 1.1rem; font-weight: 700;
  animation: popUp 1.4s ease-out forwards; pointer-events: none;
}
@keyframes popUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-1.5rem); }
}

/* ===== HELP PANEL ===== */
.help-panel {
  width: 100%; max-width: var(--max-w); padding: 0 2rem; margin: 0.4rem 0;
}
.help-box {
  background: var(--cream); border: 1px solid var(--rule); border-left: 4px solid var(--rule-dark);
  padding: 1rem 1.4rem; font-size: 0.95rem; line-height: 1.6; color: var(--text-dim);
}
.help-box .help-title {
  font-weight: 700; color: var(--text-dark); font-family: var(--serif);
  font-size: 0.85rem; text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 0.3rem;
}
.help-box b { color: var(--text-dark); }
.help-box .help-tip {
  margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--rule);
  font-size: 0.85rem; color: var(--text-dim); font-style: italic;
}

/* ===== MESSAGE AREA ===== */
.message-area {
  width: 100%; max-width: var(--max-w); padding: 0.7rem 2rem 0.3rem; text-align: center;
}
.msg { font-size: 1.15rem; color: var(--text); line-height: 1.5; }
.msg b { color: var(--text-dark); font-family: var(--serif); }
.msg.crisis-msg { color: var(--crisis-text); }

/* ===== BUTTONS ===== */
.btn {
  font-family: var(--sans); font-size: 1rem; font-weight: 600;
  padding: 0.6rem 1.6rem; border: 2px solid var(--text-dark); cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.06em; transition: all 0.15s;
}
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.35; cursor: default; filter: none; transform: none; }
.btn-gold { background: var(--text-dark); color: var(--cream); border-color: var(--text-dark); }
.btn-gold:hover { background: #2a1a0e; }
.btn-outline { background: transparent; border: 2px solid var(--rule-dark); color: var(--text-dark); }
.btn-outline:hover { background: rgba(0,0,0,0.04); }
.btn-sm { font-size: 0.8rem; padding: 0.35rem 0.9rem; }
.btn-lg { font-size: 1.2rem; padding: 0.8rem 2.5rem; }
.btn-group { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; align-items: center; }
.pass-link { font-size: 0.8rem; color: var(--text-dim); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; }
.pass-link:hover { color: var(--text-dark); }

/* ===== HAND ===== */
.hand-area {
  width: 100%; max-width: var(--max-w); padding: 0.5rem 1.5rem;
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
  min-height: 120px;
}

/* ===== CARDS ===== */
.card {
  width: 100%; border-radius: 2px; padding: 0.6rem 1rem;
  display: flex; flex-direction: column; gap: 0.15rem; cursor: default;
  border: 1.5px solid var(--rule); background: var(--card-bg); color: var(--text-dark);
  font-size: 0.85rem; position: relative; transition: all 0.15s;
  box-shadow: 1px 1px 4px rgba(0,0,0,0.08);
}
.card:hover { box-shadow: 2px 3px 10px rgba(0,0,0,0.12); }
.card.clickable { cursor: pointer; border-color: var(--rule-dark); }
.card.clickable:hover { border-color: var(--gold); box-shadow: 2px 3px 10px rgba(107,42,20,0.15); transform: translateX(4px); }
.card.selected { border-color: var(--gold); background: #e8d4b4; box-shadow: 0 0 8px rgba(107,42,20,0.15); }
.card.dimmed { opacity: 0.25; pointer-events: none; }
.card.crisis { background: var(--crisis-bg); border-color: var(--crisis-border); }
.card.crisis.selected { border-color: var(--gold); background: #e0c8aa; box-shadow: 0 0 8px rgba(107,42,20,0.15); }
.card.crisis .card-name { color: var(--crisis-text); }
.card .card-type {
  font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700;
  color: var(--text-dim);
}
.card.crisis .card-type { color: var(--crisis-text); font-weight: 900; }
.card .card-name { font-family: var(--serif); font-size: 1rem; font-weight: 700; line-height: 1.2; color: var(--text-dark); }
.card .card-desc { font-size: 0.78rem; line-height: 1.4; color: var(--text-dim); margin-top: 0.1rem; }

/* ===== CATEGORY PICKER (for any_one/any_two modals) ===== */
.cat-picker { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
.cat-btn {
  font-family: var(--sans); font-size: 0.85rem; font-weight: 700;
  padding: 0.55rem 1rem; border: 2px solid; border-radius: 2px;
  cursor: pointer; transition: all 0.15s; background: transparent;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.cat-btn:hover:not(:disabled) { filter: brightness(1.2); transform: translateY(-2px); }
.cat-btn:disabled { opacity: 0.2; cursor: default; }
.cat-btn.active { color: #fff !important; }

/* ===== TOAST ===== */
.toast-container {
  position: fixed; top: 1rem; right: 1rem; z-index: 200;
  display: flex; flex-direction: column; gap: 0.4rem; pointer-events: none;
}
.toast {
  background: var(--text-dark); color: var(--cream); font-size: 0.85rem; font-weight: 600;
  padding: 0.45rem 1rem; border-radius: 3px; box-shadow: 2px 3px 10px rgba(0,0,0,0.25);
  animation: toastIn 0.25s ease-out, toastOut 0.4s ease-in 1.8s forwards;
  white-space: nowrap; font-family: var(--sans);
}
.toast.positive { border-left: 4px solid var(--green); }
.toast.negative { border-left: 4px solid var(--red); }
.toast.neutral { border-left: 4px solid var(--rule); }
.toast.special { border-left: 4px solid var(--gold); background: #f5e6c8; font-weight: 600; }
@keyframes toastIn { from { opacity:0; transform:translateX(1rem); } to { opacity:1; transform:translateX(0); } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(-0.5rem); } }

/* ===== CONTROLS ===== */
.controls-area {
  width: 100%; max-width: var(--max-w); padding: 0.6rem 2rem 1rem; text-align: center;
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--cream); border: 2px solid var(--rule-dark);
  padding: 2rem 2.5rem; max-width: 560px; width: 92%; text-align: center;
  box-shadow: 3px 3px 20px rgba(0,0,0,0.2);
}
.modal h2 { font-family: var(--serif); color: var(--text-dark); margin-bottom: 0.8rem; font-size: 1.4rem; }
.modal p { margin-bottom: 1rem; color: var(--text); font-size: 1rem; line-height: 1.6; }
.modal .option-btn {
  display: block; width: 100%; text-align: left; padding: 0.9rem 1.2rem;
  margin-bottom: 0.6rem; font-size: 1.05rem;
  background: var(--bg); border: 1.5px solid var(--rule);
  color: var(--text); cursor: pointer; font-family: var(--sans); transition: all 0.15s;
  line-height: 1.5;
}
.modal .option-btn:hover { background: var(--bg2); border-color: var(--rule-dark); }
.modal .option-btn .opt-desc { font-size: 0.82rem; color: var(--text-dim); display: block; margin-top: 0.2rem; }

/* ===== GAME LOG ===== */
.log-toggle { position: fixed; bottom: 1rem; right: 1rem; z-index: 50; }
.log-panel {
  position: fixed; bottom: 3.5rem; right: 1rem; width: 360px; max-height: 350px;
  background: var(--cream); border: 1px solid var(--rule-dark);
  overflow-y: auto; padding: 1rem; font-size: 0.82rem; z-index: 50;
  color: var(--text-dim); line-height: 1.6;
  box-shadow: 2px 2px 10px rgba(0,0,0,0.12);
}
.log-panel.hidden { display: none; }
.log-entry.turn-header { color: var(--text-dark); font-weight: 700; font-family: var(--serif); margin-top: 0.6rem; }

/* ===== TUTORIAL ===== */
.tutorial {
  max-width: 800px; width: 95%; margin: 0 auto; padding: 2rem;
  display: flex; flex-direction: column; align-items: center; min-height: 85vh; justify-content: center;
}
.tutorial h1 {
  font-size: 3.2rem; letter-spacing: 0.18em; text-align: center; margin-bottom: 0.2rem;
  color: var(--text-dark);
}
.tutorial .t-sub {
  font-family: var(--serif); font-size: 1.15rem; font-style: italic; color: var(--text-dim);
  margin-bottom: 2rem; text-align: center;
}
.tutorial .t-page { width: 100%; }
.t-section {
  background: var(--cream); border: 1px solid var(--rule);
  padding: 2rem 2.2rem; margin-bottom: 1.2rem;
}
.t-section h2 {
  font-family: var(--serif); color: var(--text-dark); font-size: 1.5rem; margin-bottom: 0.8rem;
  display: flex; align-items: center; gap: 0.5rem;
}
.t-section p { font-size: 1.05rem; line-height: 1.75; color: var(--text); margin-bottom: 0.7rem; }
.t-section .t-highlight {
  background: var(--bg); border: 1px solid var(--rule); border-left: 4px solid var(--rule-dark);
  padding: 1rem 1.3rem; margin: 1rem 0; font-size: 1.05rem; text-align: center; line-height: 1.7;
}
.t-section .t-highlight b { color: var(--text-dark); }
.t-section ul { padding-left: 1.3rem; margin: 0.6rem 0; }
.t-section li { font-size: 1.02rem; line-height: 1.8; color: var(--text); margin-bottom: 0.4rem; }
.t-section li b { color: var(--text-dark); }
.t-cats-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.7rem; margin: 1rem 0;
}
.t-cat {
  text-align: center; padding: 0.7rem 0.4rem; background: var(--bg);
  border: 1px solid var(--rule);
}
.t-cat .t-cat-icon { font-size: 1.8rem; }
.t-cat .t-cat-label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.25rem; }
.t-cat .t-cat-desc { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.15rem; }
.t-nav { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; }
.t-dots { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.2rem; }
.t-dot {
  width: 12px; height: 12px; border-radius: 50%; background: var(--rule); transition: background 0.2s;
}
.t-dot.active { background: var(--text-dark); }
.t-steps {
  display: flex; flex-direction: column; gap: 0.6rem; margin: 1rem 0;
}
.t-step {
  display: flex; gap: 1rem; align-items: flex-start; padding: 0.8rem 1rem;
  background: var(--bg); border: 1px solid var(--rule);
}
.t-step-num {
  font-family: var(--serif); font-size: 1.5rem; font-weight: 900; color: var(--text-dark);
  min-width: 2rem; text-align: center;
}
.t-step-text { font-size: 1rem; line-height: 1.6; }
.t-step-text b { color: var(--text-dark); }
.t-step-text .t-detail { font-size: 0.88rem; color: var(--text-dim); display: block; margin-top: 0.2rem; }

/* ===== TITLE SCREEN ===== */
.title-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 85vh; text-align: center; padding: 2.5rem;
}
.title-screen h1 {
  font-size: 4.5rem; letter-spacing: 0.22em; margin-bottom: 0;
  color: var(--text-dark);
  border-top: 3px double var(--rule-dark);
  padding-top: 0.5rem; line-height: 1.1;
}
.title-screen .sub {
  display: block; font-size: 0.85rem; color: var(--text-dim); font-style: normal;
  letter-spacing: 0.3em; text-transform: uppercase; margin-top: 0.5rem;
  font-weight: 400; font-family: var(--sans);
  border-top: 1px solid var(--rule);
  border-bottom: 3px double var(--rule-dark);
  padding: 0.35rem 0;
}
.title-screen .flavor {
  max-width: 560px; font-size: 1.05rem; color: var(--text-dim); line-height: 1.85;
  margin-top: 1.5rem; margin-bottom: 2rem;
  font-family: var(--serif); font-style: italic;
}
.title-screen .dateline {
  font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase;
  letter-spacing: 0.25em; margin-top: 1rem; font-family: var(--sans); font-weight: 600;
}
.title-screen .credit { margin-top: 2rem; font-size: 0.8rem; color: var(--text-dim); font-style: italic; }

/* ===== GAME OVER ===== */
.game-over {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 75vh; text-align: center; padding: 2.5rem;
}
.game-over h2 {
  font-family: var(--serif); font-size: 2.4rem; color: var(--text-dark); margin-bottom: 0.4rem;
  border-bottom: 3px double var(--rule-dark); padding-bottom: 0.4rem;
}
.game-over .final-score { font-family: var(--serif); font-size: 5rem; font-weight: 900; color: var(--text-dark); margin: 0.5rem 0; }
.game-over .score-formula { font-size: 1.1rem; color: var(--text-dim); margin-bottom: 1.5rem; line-height: 1.6; }
.game-over .rating { font-size: 1.5rem; margin-bottom: 0.8rem; font-family: var(--serif); }
.game-over .rating-flavor {
  font-size: 1.05rem; color: var(--text-dim); max-width: 480px; line-height: 1.7; margin-bottom: 1.5rem;
  font-family: var(--serif); font-style: italic;
}
.rating-ladder {
  display: flex; flex-direction: column; gap: 0.2rem; margin-bottom: 2rem;
  width: 100%; max-width: 360px;
}
.rating-tier {
  font-size: 0.8rem; padding: 0.3rem 0.8rem; color: var(--text-dim);
  border-left: 3px solid var(--rule); font-family: var(--serif);
}
.rating-tier.active {
  color: var(--text-dark); font-weight: 700; font-size: 0.95rem;
  border-left: 3px solid var(--gold); background: rgba(107,42,20,0.06);
}
.game-over .final-cats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  margin-bottom: 2rem; width: 100%; max-width: 500px;
  border: 1px solid var(--rule);
}
.game-over .fc {
  text-align: center; padding: 0.6rem;
  border-left: 1px solid var(--rule);
}
.game-over .fc:nth-child(4n+1) { border-left: none; }
.game-over .fc:nth-child(n+5) { border-top: 1px solid var(--rule); }
.game-over .fc .fcl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.game-over .fc .fcv { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; color: var(--text-dark); }
.game-over .fc.is-low .fcv { color: var(--red); }
.game-over .fc.is-high .fcv { color: var(--green); }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  html { font-size: 16px; }
  .scoreboard { grid-template-columns: repeat(4, 1fr); }
  .score-cell:nth-child(4n+1) { border-left: none; }
  .score-cell:nth-child(5) { border-top: 1px solid var(--rule); }
  .score-total { grid-column: 1 / -1; border-left: none; border-top: 2px solid var(--rule-dark); display: flex; gap: 0.5rem; align-items: center; justify-content: center; }
  .score-total .total-value { font-size: 1.4rem; }
  .t-cats-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  html { font-size: 15px; }
  .hand-area { grid-template-columns: 1fr; }
  .scoreboard { grid-template-columns: repeat(4, 1fr); }
  .score-cell:nth-child(4n+1) { border-left: none; }
  .score-cell:nth-child(5) { border-top: 1px solid var(--rule); }
  .tutorial h1 { font-size: 2.2rem; }
  .title-screen h1 { font-size: 3rem; }
  header { flex-direction: column; align-items: flex-start; }
}

</style>
</head>
<body>
<div id="app"></div>

// ==================== CARD PARSER ====================
function parseEffect(t) {
  t = t.trim();
  if (t === 'M2') return {type:'any_one', value:2}; // legacy, converted to any_one
  if (/^D\d+$/.test(t)) return {type:'draw', value:+t.slice(1)};
  if (/^A\d+$/.test(t)) return {type:'actions', value:+t.slice(1)};
  if (/^X\d+$/.test(t)) return {type:'force_discard', value:+t.slice(1)};
  if (t === '**+1') return {type:'any_two', value:1};
  if (/^\*\+\d+$/.test(t)) return {type:'any_one', value:+t.slice(2)};
  const m = t.match(/^([A-Z]{2})([+-]\d+)$/);
  if (m) return {type:'score', cat:m[1], value:+m[2]};
  return {type:'unknown', raw:t};
}

function parseCrisis(s) {
  if (s==='SL') return [{type:'skip_legislation'}];
  if (s==='SR') return [{type:'reduce_plays'}];
  if (s==='DR') return [{type:'discard_random'}];
  if (s==='NA') return [{type:'negate_actions'}];
  if (s==='NM') return [{type:'reduce_highest'}];
  const m = s.match(/^([A-Z]{2})(-\d+)$/);
  if (m) return [{type:'score', cat:m[1], value:+m[2]}];
  return [];
}

function buildCards(data) {
  return data.map(([raw, eff], i) => {
    const crisis = raw.startsWith('!');
    const name = crisis ? raw.slice(1) : raw;
    const desc = CARD_DESC[name] || '';
    if (crisis) return {id:i, name, desc, crisis:true, effects:parseCrisis(eff), options:null, effectStr:eff};
    const options = eff.split('|').map(o => o.split('&').map(parseEffect));
    return {id:i, name, desc, crisis:false, options, effectStr:eff};
  });
}

// ==================== DESCRIBE EFFECTS ====================
function descEffect(e) {
  switch(e.type) {
    case 'score': {
      const full = CAT_FULL[e.cat]||e.cat;
      return e.value>0 ? `${full} +${e.value}` : `${full} ${e.value}`;
    }
    case 'draw': return `Draw ${e.value} card${e.value>1?'s':''}`;
    case 'actions': return `+${e.value} extra play${e.value>1?'s':''}`;
    case 'any_one': return `Any category +${e.value}`;
    case 'any_two': return `Choose 2 categories, each +${e.value}`;
    case 'force_discard': return `then discard ${e.value}`;
    case 'skip_legislation': return 'Skip your Legislation step this year';
    case 'reduce_plays': return 'Lose 1 legislation play this year';
    case 'discard_random': return 'Lose 1 random card from your hand';
    case 'negate_actions': return 'Lose 1 legislation play this year';
    case 'reduce_highest': return 'Your highest category loses 2 points';
    default: return '?';
  }
}
function descAllEffects(card) {
  if (card.crisis) return card.effects.map(descEffect).join(', ');
  return card.options.flat().map(descEffect).join(', ');
}

// ==================== GAME STATE ====================
let G = {};

function newGame() {
  G = {
    deck: shuffle([...buildCards(CARD_DATA)]),
    hand: [], discard: [],
    scores: Object.fromEntries(CATS.map(c=>[c,0])),
    turn: 0, phase: 'title',
    log: [],
    skipLeg: false, legPlays: 0, legMax: 3,
    selected: new Set(),
    pendingForceDiscard: 0, message: '', crisisMsg: false,
    tutPage: 0,
  };
  render();
}

function shuffle(a) {
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function drawCards(n) {
  const drawn = [];
  for (let i=0;i<n;i++) {
    if (!G.deck.length) {
      if (!G.discard.length) break;
      G.deck = shuffle([...G.discard]); G.discard = []; addLog('Shuffled discard back into the deck.');
    }
    drawn.push(G.deck.pop());
  }
  return drawn;
}

function addLog(t) { G.log.push(t); }
function setMsg(t, crisis=false) { G.message=t; G.crisisMsg=crisis; }

// ==================== PHASE LOGIC ====================
function startTurn() {
  G.turn++;
  if (G.turn > 8) { endGame(); return; }
  G.skipLeg=false; G.legPlays=0; G.legMax=3;
  G.selected.clear();
  addLog(`── ${1932+G.turn} ──`);
  proposalPhase();
}

function proposalPhase() {
  G.phase = 'proposal';
  const need = Math.max(0, 9-G.hand.length);
  if (need>0) { G.hand.push(...drawCards(need)); addLog(`Drew ${need} cards (hand: ${G.hand.length})`); }
  setMsg(`<b>${1932+G.turn}</b> — You drew cards. Your hand is full.`);
  setTimeout(()=>{ depressionPhase(); }, 500);
  render();
}

function depressionPhase() {
  G.phase = 'depression'; G.selected.clear();
  const crisis = G.hand.filter(c=>c.crisis);
  if (!crisis.length) {
    addLog('No crisis cards.');
    setMsg('Good news — no crises this year! Moving to Legislation...');
    setTimeout(()=>{ legislationPhase(); }, 1200);
    render(); return;
  }
  setMsg(`⚠️ <b>Crisis!</b> You have <b>${crisis.length}</b> crisis card${crisis.length>1?'s':''}. You must play one — click a <span style="color:var(--crisis-text)">red card</span> to resolve it.`, true);
  render();
}

function playCrisis(idx) {
  const card = G.hand[idx];
  if (!card||!card.crisis) return;
  G.hand.splice(idx,1); G.discard.push(card);
  addLog(`CRISIS: ${card.name}`);
  for (const e of card.effects) {
    switch(e.type) {
      case 'score': G.scores[e.cat]+=e.value; addLog(`  ${CAT_FULL[e.cat]} ${e.value}`); flashScore(e.cat,e.value); showToast(`${e.value} ${CAT_FULL[e.cat]}`,'negative'); break;
      case 'skip_legislation': G.skipLeg=true; addLog('  Legislation skipped!'); showToast('Legislation skipped!','negative'); break;
      case 'reduce_plays': G.legMax=Math.max(1,G.legMax-1); addLog('  Lost 1 legislation play!'); showToast('Lost 1 legislation play','negative'); break;
      case 'discard_random':
        if (G.hand.length) { const r=Math.floor(Math.random()*G.hand.length); const c=G.hand.splice(r,1)[0]; G.discard.push(c); addLog(`  Lost card: ${c.name}`); showToast(`Lost: ${c.name}`,'negative'); }
        break;
      case 'negate_actions': G.legMax=Math.max(1,G.legMax-1); addLog('  Lost 1 legislation play!'); showToast('Lost 1 play','negative'); break;
      case 'reduce_highest': {
        const vals=CATS.map(c=>G.scores[c]);
        const mx=Math.max(...vals);
        const cat=CATS.find(c=>G.scores[c]===mx);
        G.scores[cat]-=2; addLog(`  ${CAT_FULL[cat]} -2`); flashScore(cat,-2); showToast(`-2 ${CAT_FULL[cat]}`,'negative');
        break;
      }
    }
  }
  setMsg(`Crisis resolved: <b>${card.name}</b> — ${card.effects.map(descEffect).join(', ')}`, true);
  setTimeout(()=>{ legislationPhase(); }, 2500);
  render();
}

function legislationPhase() {
  if (G.skipLeg) {
    addLog('Legislation skipped (crisis).'); setMsg('Legislation <b>skipped</b> by crisis! Moving to Clean Up...', true);
    setTimeout(()=>{ politicsPhase(); }, 700); render(); return;
  }
  G.phase='legislation'; G.selected.clear();
  const rem=G.legMax-G.legPlays;
  setMsg(`⚖️ <b>Choose a piece of legislation to support.</b> (${G.legPlays+1} of ${G.legMax})`);
  render();
}
function hasPlayableCards() { return G.hand.some(c=>!c.crisis); }

function playLegislation(idx) {
  const card = G.hand[idx];
  if (!card||card.crisis) return;
  G.hand.splice(idx,1); G.discard.push(card);
  const allEffects = card.options.flat();
  const desc = allEffects.map(descEffect).join(', ');
  addLog(`Played: ${card.name} → ${desc}`);
  setMsg(`Played: <b>${card.name}</b> — ${desc}`);
  resolveEffects(allEffects, ()=>afterLegPlay());
}

function resolveEffects(effects, cb) {
  let i=0;
  function next() {
    if (i>=effects.length) { render(); cb(); return; }
    const e=effects[i++];
    switch(e.type) {
      case 'score': G.scores[e.cat]+=e.value; flashScore(e.cat,e.value); showToast(`${e.value>0?'+':''}${e.value} ${CAT_FULL[e.cat]}`, e.value>0?'positive':'negative'); next(); break;
      case 'draw': G.hand.push(...drawCards(e.value)); addLog(`  Drew ${e.value} card${e.value>1?'s':''}`); showToast(`+${e.value} card${e.value>1?'s':''}`,'neutral'); next(); break;
      case 'actions': G.legMax+=e.value; addLog(`  +${e.value} extra play${e.value>1?'s':''}`); showToast(`+${e.value} extra play${e.value>1?'s':''}`,'positive'); next(); break;
      case 'force_discard': showForceDiscardModal(e.value, next); return;
      case 'any_one': showCatPickerModal(1,e.value,next); return;
      case 'any_two': showToast('★ Special card! Choose 2 categories to boost!','special'); showCatPickerModal(2,e.value,next); return;
      default: next();
    }
  }
  next();
}

function showForceDiscardModal(count, cb) {
  G._fdCount=count; G._fdCb=cb;
  G.phase='force_discard'; G.selected.clear();
  setMsg(`You drew extra cards — select <b>${count}</b> card${count>1?'s':''} to discard.`);
  render();
}
function confirmForceDiscard() {
  if (G.selected.size!==G._fdCount) return;
  const indices=[...G.selected].sort((a,b)=>b-a);
  const names=indices.map(i=>G.hand[i].name);
  for (const i of indices) G.discard.push(G.hand.splice(i,1)[0]);
  addLog(`  Discarded: ${names.join(', ')}`);
  G.selected.clear();
  const cb=G._fdCb; G._fdCb=null; G._fdCount=0;
  render(); cb();
}

function showCatPickerModal(count, val, cb) {
  G._cpCount=count; G._cpVal=val; G._cpPicked=[]; G._cpCb=cb;
  renderCatPicker();
}
function renderCatPicker() {
  const m=document.getElementById('modal');
  const rem=G._cpCount-G._cpPicked.length;
  let h=`<div class="modal"><h2>Choose ${G._cpCount===1?'a Category':`${G._cpCount} Categories`}</h2>`;
  h+=`<p>Each chosen category gets <b>+${G._cpVal}</b> to its score. ${rem>0?`Pick ${rem} more.`:'All chosen!'}</p>`;
  h+=`<div class="cat-picker">`;
  CATS.forEach(cat=>{
    const picked=G._cpPicked.includes(cat);
    const dis=!picked&&rem<=0;
    h+=`<button class="cat-btn${picked?' active':''}" style="border-color:${CAT_COLOR[cat]};color:${CAT_COLOR[cat]};${picked?'background:'+CAT_COLOR[cat]:''}" ${dis?'disabled':''} onclick="pickCat('${cat}')">${CAT_ICON[cat]}<br>${CAT_FULL[cat]}<br><span style="font-size:0.55rem;opacity:0.7">Current: ${G.scores[cat]}</span></button>`;
  });
  h+=`</div>`;
  if (G._cpPicked.length===G._cpCount) h+=`<div class="btn-group" style="margin-top:1rem"><button class="btn btn-gold" onclick="confirmCatPick()">Confirm</button></div>`;
  h+=`</div>`; m.innerHTML=h; m.classList.remove('hidden');
}
function pickCat(cat) {
  const i=G._cpPicked.indexOf(cat);
  if (i>=0) G._cpPicked.splice(i,1);
  else if (G._cpPicked.length<G._cpCount) G._cpPicked.push(cat);
  renderCatPicker();
}
function confirmCatPick() {
  closeModal();
  for (const cat of G._cpPicked) { G.scores[cat]+=G._cpVal; flashScore(cat,G._cpVal); addLog(`  ${CAT_FULL[cat]} +${G._cpVal}`); showToast(`+${G._cpVal} ${CAT_FULL[cat]}`,'positive'); }
  const cb=G._cpCb; G._cpCb=null; render(); cb();
}

function afterLegPlay() {
  G.legPlays++;
  if (G.legPlays < G.legMax && hasPlayableCards()) {
    G.phase='legislation';
    setMsg(`⚖️ <b>Legislation</b> — Play another card. (${G.legPlays+1} of ${G.legMax})`);
    render();
  } else {
    setTimeout(()=>politicsPhase(), 500); render();
  }
}

function politicsPhase() {
  if (!G.hand.length) {
    addLog('No cards to discard.'); setMsg('Hand empty — moving to next turn.');
    setTimeout(()=>startTurn(), 500); render(); return;
  }
  G.phase='politics'; G.selected.clear();
  setMsg('🗑️ <b>Clean Up</b> — Select <b>1 to 5 cards</b> to discard from your hand, then confirm.');
  render();
}

function toggleDiscardCard(idx) {
  const max = G.phase==='force_discard' ? (G._fdCount||1) : 5;
  if (G.selected.has(idx)) G.selected.delete(idx);
  else if (G.selected.size<max) G.selected.add(idx);
  render();
}

function confirmDiscard() {
  if (G.selected.size<1||G.selected.size>5) return;
  const indices=[...G.selected].sort((a,b)=>b-a);
  const names=indices.map(i=>G.hand[i].name);
  for (const i of indices) G.discard.push(G.hand.splice(i,1)[0]);
  addLog(`Discarded ${names.length}: ${names.join(', ')}`);
  G.selected.clear();
  setMsg(`Discarded ${names.length} card${names.length>1?'s':''}. ${1932+G.turn} complete!`);
  render();
  setTimeout(()=>startTurn(), 700);
}

function endGame() {
  G.phase='gameover';
  const vals=CATS.map(c=>G.scores[c]);
  G.finalMin=Math.min(...vals); G.finalMax=Math.max(...vals);
  G.finalScore=G.finalMin*G.finalMax;
  G.finalMinCat=CATS.find(c=>G.scores[c]===G.finalMin);
  G.finalMaxCat=CATS.find(c=>G.scores[c]===G.finalMax);
  addLog('=== GAME OVER ===');
  addLog(`Final: ${G.finalMin} × ${G.finalMax} = ${G.finalScore}`);
  render();
}

const RATINGS = [
  [0,  '💀 Hooverville','The Depression deepened under your watch. Millions remain without hope.'],
  [8,  '📉 Tough Times','Some progress, but the recovery is painfully slow.'],
  [20, '⚖️ Slow Recovery','The nation is healing, but unevenly.'],
  [35, '🏛️ Steady Progress','The New Deal programs are working, and Americans can see a future.'],
  [55, '🇺🇸 The New Deal Works!','Strong, balanced recovery across the board.'],
  [Infinity, '⭐ A New Era!','An extraordinary achievement — a new age of prosperity.'],
];
function getRating(s) {
  for (const [max, title, flavor] of RATINGS) if (s<=max) return [title, flavor];
  return RATINGS[RATINGS.length-1].slice(1);
}
function renderRatingLadder(score) {
  return RATINGS.map(([max, title]) => {
    const [playerTitle] = getRating(score);
    const active = title === playerTitle;
    return `<div class="rating-tier${active?' active':''}">${title}</div>`;
  }).reverse().join('');
}

function passPhase() {
  if (G.phase==='legislation') { addLog('Passed Legislation.'); politicsPhase(); }
}

function closeModal() { document.getElementById('modal').classList.add('hidden'); }

function showToast(text, type='neutral') {
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.textContent=text;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

// ==================== SCORE FLASH ====================
function flashScore(cat, value) {
  setTimeout(()=>{
    const el=document.querySelector(`.score-cell[data-cat="${cat}"]`);
    if (!el) return;
    el.classList.add(value>0?'flash-up':'flash-down');
    const pop=document.createElement('div');
    pop.className='score-pop'; pop.style.color=value>0?'var(--green)':'var(--red)';
    pop.textContent=(value>0?'+':'')+value; el.appendChild(pop);
    setTimeout(()=>{ el.classList.remove('flash-up','flash-down'); pop.remove(); },1200);
  },50);
}

        <div class="t-step"><div class="t-step-num">1</div><div class="t-step-text"><b>Draw Cards</b><span class="t-detail">Your hand fills up to 9 cards. This happens automatically.</span></div></div>
        <div class="t-step"><div class="t-step-num">2</div><div class="t-step-text"><b>Handle Crises</b><span class="t-detail">If you have any red "Crisis" cards, you must play one. These are bad events — pick the least harmful one.</span></div></div>
        <div class="t-step"><div class="t-step-num">3</div><div class="t-step-text"><b>Pass Legislation</b><span class="t-detail">Play up to 3 cards from your hand. Each card's effects are applied automatically — boosting scores, drawing cards, or earning extra plays.</span></div></div>
        <div class="t-step"><div class="t-step-num">4</div><div class="t-step-text"><b>Discard</b><span class="t-detail">Throw away 1–5 cards you don't want. Dump crisis cards when you can!</span></div></div>
      </div>
    </div>`,
  ()=>`
    <div class="t-section">
      <h2>🃏 How Cards Work</h2>
      <p>Each card represents a real New Deal program, person, or policy. When you play a card, <b>all of its effects</b> are applied automatically — you might boost one or more categories, draw extra cards, or earn extra plays this year.</p>
      <p>Some cards give you <b>extra plays</b> beyond the normal 3, letting you pass more legislation in a single year!</p>
      <div class="t-highlight">
        <b>Tip:</b> Read the historical descriptions on each card — every card is a real piece of New Deal history!
      </div>
    </div>`,
  ()=>`
    <div class="t-section">
      <h2>🎯 Tips for Success</h2>
      <ul>
        <li><b>Balance your scores.</b> Lowest × Highest means a zero in any category gives you a score of zero. Spread the love!</li>
        <li><b>Play all 3 cards each year.</b> Every card you play helps — don't waste your plays!</li>
        <li><b>Discard crisis cards</b> in the cleanup step when you can — get them out of your hand before you're forced to play them.</li>
        <li><b>Extra plays are powerful.</b> Some cards let you play more cards in the same year.</li>
        <li>Don't panic! Even bad years are historically accurate. 😄</li>
      </ul>
      <div class="t-highlight">
        <b>Ready?</b> The game will guide you through each step. Look for the blue help box below the scores — it explains what to do.
      </div>
    </div>`,
];

function renderTutorial(app) {
  const page = G.tutPage;
  const total = TUTORIAL_PAGES.length;
  let dots = '<div class="t-dots">';
  for (let i=0;i<total;i++) dots+=`<div class="t-dot${i===page?' active':''}"></div>`;
  dots+='</div>';

  const isLast = page===total-1;
  const isFirst = page===0;
  let nav = '<div class="t-nav">';
  if (!isFirst) nav+=`<button class="btn btn-outline" onclick="tutPrev()">← Back</button>`;
  if (!isLast) nav+=`<button class="btn btn-gold btn-lg" onclick="tutNext()">Next →</button>`;
  else nav+=`<button class="btn btn-gold btn-lg" onclick="beginPlay()">🎮 Start Playing!</button>`;
  nav+='</div>';

  app.innerHTML = `<div class="tutorial">
    <h1 style="font-size:2.2rem">THE NEW DEAL</h1>
    <div class="t-sub">How to Play</div>
    ${dots}
    <div class="t-page">${TUTORIAL_PAGES[page]()}</div>
    ${nav}
    <div style="margin-top:1rem"><button class="btn btn-outline btn-sm" onclick="beginPlay()">Skip tutorial →</button></div>
  </div>`;
}

function tutNext() { if (G.tutPage<TUTORIAL_PAGES.length-1) { G.tutPage++; render(); } }
function tutPrev() { if (G.tutPage>0) { G.tutPage--; render(); } }
function beginPlay() { G.phase='playing'; startTurn(); }
function showTutorial() { G.phase='tutorial'; G.tutPage=0; render(); }


// ==================== RENDERING ====================
function render() {
  const app = document.getElementById('app');
  if (G.phase==='title') { renderTitle(app); return; }
  if (G.phase==='tutorial') { renderTutorial(app); return; }
  if (G.phase==='gameover') { renderGameOver(app); return; }

  app.innerHTML = renderHeader() + '<div class="deco"></div>' + renderScoreboard() + renderMessage() + renderHandArea() + renderControls();
  renderLog();
}

function renderTitle(app) {
  app.innerHTML = `<div class="title-screen">
    <h1>THE NEW DEAL</h1>
    <p class="dateline">Washington, D.C. &mdash; November 1932</p>
    <p class="flavor">
      The nation reels from the Great Depression &mdash; banks have failed,<br>
      factories sit idle, and one in four Americans is out of work.<br>
      As Franklin D. Roosevelt, you'll sign legislation, launch relief programs,<br>
      and appoint key advisors to pull the country back from the brink.
    </p>
    <button class="btn btn-gold btn-lg" onclick="showTutorial()">Read the Bulletin</button>
    <p class="credit">Based on the card game by Lloyd Krassner (Warp Spawn Games, 2012)</p>
  </div>`;
}

function renderGameOver(app) {
  const [title, flavor] = getRating(G.finalScore);
  let cats='';
  CATS.forEach(c=>{
    const low=G.scores[c]===G.finalMin, high=G.scores[c]===G.finalMax;
    cats+=`<div class="fc${low?' is-low':''}${high?' is-high':''}">
      <div class="fcl" style="color:${CAT_COLOR[c]}">${CAT_ICON[c]} ${CAT_FULL[c]}</div>
      <div class="fcv">${G.scores[c]}</div>
    </div>`;
  });
  app.innerHTML = `<div class="game-over">
    <h2>EXTRA! &mdash; Final Edition, 1941</h2>
    <div class="final-cats">${cats}</div>
    <div class="score-formula">
      Lowest: <b style="color:var(--red)">${CAT_FULL[G.finalMinCat]} (${G.finalMin})</b> ×
      Highest: <b style="color:var(--green)">${CAT_FULL[G.finalMaxCat]} (${G.finalMax})</b>
    </div>
    <div class="final-score">${G.finalScore}</div>
    <div class="rating">${title}</div>
    <div class="rating-flavor">${flavor}</div>
    <div class="rating-ladder">${renderRatingLadder(G.finalScore)}</div>
    <div class="btn-group">
      <button class="btn btn-gold btn-lg" onclick="startGame()">Play Again</button>
    </div>
  </div>`;
}

function startGame() { newGame(); showTutorial(); }

function renderHeader() {
  const names={proposal:'Drawing…',depression:'Crisis',legislation:'Legislation',force_discard:'Discard',politics:'Clean Up'};
  const currentYear = 1932 + G.turn;
  const timeline = Array.from({length:8},(_,i)=>1933+i).map(y=>
    `<span class="timeline-year${y===currentYear?' active':''}">${y}</span>`
  ).join('');
  return `<header>
    <h1>THE NEW DEAL</h1>
    <div class="timeline">${timeline}</div>
    <div class="hud">
      <div class="hud-item"><span class="hud-label">Deck</span><span class="hud-value">${G.deck.length}</span></div>
      <div class="hud-item"><span class="hud-label">Hand</span><span class="hud-value">${G.hand.length}</span></div>
      <span class="hud-phase">${names[G.phase]||G.phase}</span>
    </div>
  </header>`;
}

function renderScoreboard() {
  const vals=CATS.map(c=>G.scores[c]);
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const total=lo*hi;
  const loCat=CATS.find(c=>G.scores[c]===lo), hiCat=CATS.find(c=>G.scores[c]===hi);
  return `<div class="scoreboard">${CATS.map(c=>`<div class="score-cell" data-cat="${c}">
    <div class="cat-label" style="color:${CAT_COLOR[c]}">${CAT_ICON[c]}</div>
    <div class="cat-name">${CAT_FULL[c]}</div>
    <div class="cat-score" style="color:${CAT_COLOR[c]}">${G.scores[c]}</div>
  </div>`).join('')}<div class="score-total">
    <div class="total-label">Score</div>
    <div class="total-value">${total}</div>
    <div class="total-tooltip">Lowest × Highest = Final Score<br>${CAT_FULL[loCat]} (${lo}) × ${CAT_FULL[hiCat]} (${hi}) = <b>${total}</b></div>
  </div></div>`;
}

function renderMessage() {
  return `<div class="message-area"><div class="msg${G.crisisMsg?' crisis-msg':''}">${G.message}</div></div>`;
}

function renderHandArea() {
  let html='<div class="hand-area">';
  if (!G.hand.length) html+='<div style="color:var(--text-dim);font-style:italic;padding:2rem">Your hand is empty.</div>';

  G.hand.forEach((card,idx)=>{
    const cls=['card'];
    if (G.selected.has(idx)) cls.push('selected');
    if (card.crisis) cls.push('crisis');
    let clickable=false, dimmed=false;

    if (G.phase==='depression') { if (card.crisis) clickable=true; else dimmed=true; }
    else if (G.phase==='legislation') { if (!card.crisis) clickable=true; else dimmed=true; }
    else if (G.phase==='politics'||G.phase==='force_discard') { clickable=true; }

    if (clickable) cls.push('clickable');
    if (dimmed) cls.push('dimmed');

    let onclick='';
    if (G.phase==='depression'&&card.crisis) onclick=`onclick="playCrisis(${idx})"`;
    else if (G.phase==='legislation'&&!card.crisis) onclick=`onclick="playLegislation(${idx})"`;
    else if (G.phase==='politics'||G.phase==='force_discard') onclick=`onclick="toggleDiscardCard(${idx})"`;

    html+=`<div class="${cls.join(' ')}" ${onclick}>
      <div class="card-type">${card.crisis?'⚠ CRISIS':(CARD_TYPE[card.name]||'POLICY')}</div>
      <div class="card-name">${card.name}</div>
      ${card.desc?`<div class="card-desc">${card.desc}</div>`:''}
    </div>`;
  });
  html+='</div>';
  return html;
}

function renderControls() {
  let h='<div class="controls-area"><div class="btn-group">';
  const phase=G.phase;

  if (phase==='legislation') {
    h+=`<span class="pass-link" onclick="passPhase()">skip to Clean Up →</span>`;
  } else if (phase==='force_discard') {
    const n=G.selected.size, need=G._fdCount||1;
    h+=`<button class="btn btn-gold" onclick="confirmForceDiscard()" ${n!==need?'disabled':''}>Discard ${n}/${need} Card${need!==1?'s':''}</button>`;
    if (n<need) h+=`<span style="font-size:0.8rem;color:var(--text-dim);margin-left:0.5rem">← select ${need-n} more</span>`;
  } else if (phase==='politics') {
    const n=G.selected.size;
    h+=`<button class="btn btn-gold" onclick="confirmDiscard()" ${n<1||n>5?'disabled':''}>Discard ${n} Card${n!==1?'s':''}</button>`;
    if (n<1) h+=`<span style="font-size:0.8rem;color:var(--text-dim);margin-left:0.5rem">← click 1–5 cards first</span>`;
  }

  h+='</div></div>';
  return h;
}

function renderLog() {
  const p=document.getElementById('logPanel');
  p.innerHTML=G.log.map(e=>`<div class="log-entry${e.startsWith('──')?' turn-header':''}">${e}</div>`).join('');
  p.scrollTop=p.scrollHeight;
}

function toggleLog() { document.getElementById('logPanel').classList.toggle('hidden'); }

// ==================== INIT ====================
newGame();
</script>
</body>
</html>
